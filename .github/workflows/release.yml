
name: Create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    env:
      DIST_DIR: dist
      RELEASE_ZIP: dist/${{ github.event.repository.name }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create release ZIP
        shell: bash
        run: |
          mapfile -t RELEASE_FILES < .github/release-files.txt

          mkdir -p "$DIST_DIR"

          git archive \
            --format=zip \
            --output="$RELEASE_ZIP" \
            "$GITHUB_SHA" \
            "${RELEASE_FILES[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" \
            "$RELEASE_ZIP" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
